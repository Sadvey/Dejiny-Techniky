<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dejiny Techniky - Mobile + Dark Mode</title>
<style>
    :root {
        /* SVETLÁ TÉMA (Default) */
        --primary: #007bff;
        --success: #28a745;
        --danger: #dc3545;
        --bg: #f0f2f5;
        --card-bg: #ffffff;
        --text-main: #333333;
        --text-sec: #666666;
        --border: #e9ecef;
        --btn-bg: #fff;
        --header-bg: #ffffff;
        --shadow: rgba(0,0,0,0.05);
    }

    /* TMAVÁ TÉMA (Override) */
    body.dark-mode {
        --bg: #18191a;
        --card-bg: #242526;
        --text-main: #e4e6eb;
        --text-sec: #b0b3b8;
        --border: #3a3b3c;
        --btn-bg: #242526;
        --header-bg: #242526;
        --shadow: rgba(0,0,0,0.3);
    }

    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        margin: 0; 
        padding: 15px; 
        background-color: var(--bg); 
        color: var(--text-main); 
        padding-bottom: 50px;
        transition: background-color 0.3s, color 0.3s; /* Plynulá zmena */
    }
    
    header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; 
        padding: 10px 15px;
        background: var(--header-bg);
        border-radius: 12px;
        box-shadow: 0 2px 5px var(--shadow);
        transition: background-color 0.3s;
    }

    .header-buttons {
        display: flex;
        gap: 10px;
    }
    
    h1 { margin: 0; font-size: 1.1rem; color: var(--text-main); font-weight: 800; }
    
    .nav-btn { 
        padding: 8px 12px; 
        background: var(--bg); 
        color: var(--text-main); 
        border: 1px solid var(--border); 
        border-radius: 8px; 
        cursor: pointer; 
        font-weight: 600;
        font-size: 0.9rem; 
        transition: 0.2s;
    }

    .nav-btn:active { transform: scale(0.95); }

    .view { display: none; animation: fadeIn 0.3s; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Menu Grid */
    .menu-grid { display: grid; gap: 15px; grid-template-columns: 1fr; }
    
    .menu-card { 
        background: var(--card-bg); 
        padding: 20px; 
        border-radius: 16px; 
        box-shadow: 0 2px 8px var(--shadow); 
        text-align: center; 
        cursor: pointer; 
        border: 1px solid var(--border);
        transition: transform 0.1s, background-color 0.3s;
    }
    
    .menu-card:active { transform: scale(0.98); }
    .menu-card h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 1.3rem; }
    .menu-card p { margin: 0; color: var(--text-sec); font-size: 0.95rem; }

    /* Quiz Styling */
    .question-card { 
        background: var(--card-bg); 
        padding: 20px; 
        border-radius: 16px; 
        box-shadow: 0 2px 10px var(--shadow); 
        transition: background-color 0.3s;
    }
    .question-text { font-weight: 700; font-size: 1.1em; margin-bottom: 20px; line-height: 1.4; color: var(--text-main); }
    
    .options { display: flex; flex-direction: column; gap: 12px; }
    
    .opt-btn { 
        padding: 16px; 
        border: 2px solid var(--border); 
        background: var(--btn-bg); 
        cursor: pointer; 
        text-align: left; 
        border-radius: 12px; 
        font-size: 1rem; 
        line-height: 1.4; 
        color: var(--text-main);
        -webkit-tap-highlight-color: transparent;
        transition: 0.2s;
    }
    
    .opt-btn:active { opacity: 0.8; }
    .opt-btn.correct { background-color: rgba(40, 167, 69, 0.2); border-color: var(--success); color: var(--success); font-weight: 700; }
    .opt-btn.wrong { background-color: rgba(220, 53, 69, 0.2); border-color: var(--danger); color: var(--danger); }
    
    /* Dark mode text corrections for buttons */
    body.dark-mode .opt-btn.correct { color: #4cd16f; }
    body.dark-mode .opt-btn.wrong { color: #ff6b6b; }

    .status-bar { 
        display: flex; 
        justify-content: space-between; 
        color: var(--text-sec); 
        margin-bottom: 15px; 
        font-size: 0.9rem; 
        font-weight: 500;
        background: var(--header-bg);
        padding: 10px 15px;
        border-radius: 50px;
        box-shadow: 0 2px 5px var(--shadow);
    }
    
    /* Study List */
    .study-list { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
    .study-item { padding: 20px; border-bottom: 1px solid var(--border); }
    .study-q { font-weight: bold; margin-bottom: 8px; color: var(--text-main); font-size: 1rem; }
    .study-a { color: var(--success); font-weight: 700; background: rgba(40, 167, 69, 0.1); display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; }
    body.dark-mode .study-a { background: rgba(40, 167, 69, 0.2); color: #4cd16f; }
    
    .search-box { 
        width: 100%; 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 1px solid var(--border); 
        background: var(--card-bg);
        color: var(--text-main);
        border-radius: 12px; 
        box-shadow: 0 2px 10px var(--shadow);
        font-size: 1rem; 
        box-sizing: border-box;
    }

    /* Result Area */
    .result-area { text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); }
    .big-score { font-size: 4rem; font-weight: 800; color: var(--primary); margin: 20px 0; }

    @media (min-width: 600px) {
        .menu-grid { grid-template-columns: repeat(3, 1fr); }
        body { padding: 40px; max-width: 900px; margin: 0 auto; }
    }
</style>
</head>
<body>

<header>
    <h1>🎓 Dejiny Techniky</h1>
    <div class="header-buttons">
        <button class="nav-btn" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <button class="nav-btn" onclick="showMenu()">Menu</button>
    </div>
</header>

<div id="menu-view" class="view active">
    <div class="menu-grid">
        <div class="menu-card" onclick="startQuiz('sequential')">
            <h3>📝 Zaradom</h3>
            <p>1 → 73</p>
        </div>
        <div class="menu-card" onclick="startQuiz('random')">
            <h3>🔀 Náhodne</h3>
            <p>Mix otázok</p>
        </div>
        <div class="menu-card" onclick="showStudyList()">
            <h3>📖 Zoznam</h3>
            <p>Všetky odpovede</p>
        </div>
    </div>
</div>

<div id="quiz-view" class="view">
    <div class="status-bar">
        <span>Otázka: <b id="q-current">1</b>/<span id="q-total">73</span></span>
        <span>Skóre: <b id="score-display">0</b></span>
    </div>
    <div id="quiz-container"></div>
</div>

<div id="result-view" class="view">
    <div class="result-area">
        <h2>Hotovo! 🎉</h2>
        <p>Tvoje skóre:</p>
        <div class="big-score"><span id="final-score">0</span>/<span id="final-total">0</span></div>
        <button class="nav-btn" style="background: var(--primary); color: white; border: none; padding: 15px 30px; font-size: 1.1rem;" onclick="showMenu()">Nové kolo</button>
    </div>
</div>

<div id="list-view" class="view">
    <input type="text" id="search" class="search-box" placeholder="🔍 Hľadať otázku..." onkeyup="filterList()">
    <div id="study-content" class="study-list"></div>
</div>

<script>

// --- APP STATE ---
let activeQuizData = [];
let currentQIndex = 0;
let score = 0;

// --- UTILS ---
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
}

// --- THEME LOGIC ---
function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('theme-toggle');
    body.classList.toggle('dark-mode');
    
    if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        btn.innerText = '☀️';
    } else {
        localStorage.setItem('theme', 'light');
        btn.innerText = '🌙';
    }
}

// Check saved theme on load
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-toggle').innerText = '☀️';
}

// --- APP LOGIC ---
function showMenu() {
    switchView('menu-view');
    document.getElementById('search').value = '';
}

function startQuiz(mode) {
    score = 0;
    currentQIndex = 0;
    activeQuizData = mode === 'random' ? shuffleArray(originalDb) : [...originalDb];
    
    document.getElementById('q-total').innerText = activeQuizData.length;
    document.getElementById('score-display').innerText = 0;
    
    switchView('quiz-view');
    loadQuestion();
}

function loadQuestion() {
    if (currentQIndex >= activeQuizData.length) {
        finishQuiz();
        return;
    }

    const data = activeQuizData[currentQIndex];
    document.getElementById('q-current').innerText = currentQIndex + 1;
    
    const container = document.getElementById("quiz-container");
    container.innerHTML = `
        <div class="question-card">
            <div class="question-text">${data[0]}</div>
            <div class="options">
                ${data[1].map((opt, index) => 
                    `<button class="opt-btn" onclick="checkAnswer(this, ${index}, ${data[2]})">${String.fromCharCode(97+index)}) ${opt}</button>`
                ).join('')}
            </div>
        </div>
    `;
}

function checkAnswer(btn, index, correctIndex) {
    const buttons = document.querySelectorAll(".opt-btn");
    buttons.forEach(b => b.disabled = true);
    
    if (index === correctIndex) {
        btn.classList.add("correct");
        score++;
        document.getElementById('score-display').innerText = score;
    } else {
        btn.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");
    }

    setTimeout(() => {
        currentQIndex++;
        loadQuestion();
    }, 1200);
}

function finishQuiz() {
    document.getElementById('final-score').innerText = score;
    document.getElementById('final-total').innerText = activeQuizData.length;
    switchView('result-view');
}

function showStudyList() {
    const listContainer = document.getElementById('study-content');
    listContainer.innerHTML = originalDb.map(item => `
        <div class="study-item" data-text="${item[0].toLowerCase()}">
            <div class="study-q">${item[0]}</div>
            <div class="study-a">✅ ${item[1][item[2]]}</div>
        </div>
    `).join('');
    switchView('list-view');
}

function filterList() {
    const filter = document.getElementById('search').value.toLowerCase();
    const items = document.querySelectorAll('.study-item');
    items.forEach(item => {
        const text = item.getAttribute('data-text');
        item.style.display = text.includes(filter) ? 'block' : 'none';
    });
}
</script>
